<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Fubao · 离线</title>
    <style>
      html {
        font:
          16px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #f5f4f0;
        color: #161614;
      }
      body {
        box-sizing: border-box;
        min-height: 100dvh;
        max-width: 430px;
        margin: auto;
        padding: calc(56px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
        line-height: 1.7;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-weight: 500;
        font-size: 28px;
      }
      p {
        color: #5d6875;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 24px;
        background: #456984;
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
        margin-top: 12px;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #171b20;
          color: #eef1f5;
        }
        p {
          color: #aeb9c5;
        }
        a {
          background: #a8c3da;
          color: #171b20;
        }
      }
    </style>
  </head>
  <body>
    <img src="/brand-cat.png" alt="" />
    <h1>fubao.</h1>
    <p>暂时没有网络。</p>
    <p>连上网络后，就能继续查看和记录生活。尚未保存的内容不会自动提交。</p>
    <p lang="en">You’re offline. Reconnect to view and save your records.</p>
    <a href="/">重新连接 / Retry</a>
  </body>
</html>
